<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>PAINT</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
  body { margin:0; font-family:sans-serif; background:#eee; touch-action:none; }
  #bar { display:flex; gap:8px; padding:8px; background:#222; align-items:center; }
  #bar button, #bar input { height:36px; }
  canvas { background:#fff; display:block; }
</style>
</head>
<body>
<div id="bar">
  <input type="color" id="color" value="#000000">
  <input type="range" id="size" min="1" max="40" value="5">
  <button id="clear">Borrar todo</button>
</div>
<canvas id="c"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
function resize() {
  c.width = innerWidth;
  c.height = innerHeight - 52;
}
resize();
let drawing = false;
function pos(e) {
  const r = c.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
c.addEventListener('pointerdown', e => {
  drawing = true;
  const p = pos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
});
c.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = pos(e);
  ctx.strokeStyle = document.getElementById('color').value;
  ctx.lineWidth = document.getElementById('size').value;
  ctx.lineCap = 'round';
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});
addEventListener('pointerup', () => drawing = false);
document.getElementById('clear').onclick = () => ctx.clearRect(0, 0, c.width, c.height);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
